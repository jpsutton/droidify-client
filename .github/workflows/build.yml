name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - repos.json
  pull_request:
    paths-ignore:
      - repos.json
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used in `if:` directly; expose whether the signing key exists.
      HAS_SIGNING_KEY: ${{ secrets.KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      # Pull requests from forks and repos without the secrets get an unsigned APK, which
      # cannot be installed. Set KEY_BASE64, KEY_ALIAS and KEYSTORE_PASS to get a signed one.
      - uses: r0adkll/sign-android-release@v1
        name: Sign APK
        id: sign_app
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASS }}
          keyPassword: ${{ secrets.KEYSTORE_PASS }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload signed APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: droidify-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload unsigned APK
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: droidify-unsigned
          path: app/build/outputs/apk/release/*.apk

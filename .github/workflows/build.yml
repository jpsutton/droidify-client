name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - repos.json
  pull_request:
    paths-ignore:
      - repos.json
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Secrets cannot be used in `if:` directly; expose whether the signing key exists.
      HAS_SIGNING_KEY: ${{ secrets.KEY_BASE64 != '' }}
      # Pushes to main and manual runs publish a release. Pull requests only build.
      IS_RELEASE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      # Release tag is the UTC date, YYYYMMDD. A second release on the same day gets -2, -3, ...
      # versionCode is YYYYMMDD * 100 + n, so it always increases and Android accepts the update.
      - name: Pick version
        id: version
        if: env.IS_RELEASE == 'true'
        run: |
          day=$(date -u +%Y%m%d)
          n=1
          tag=$day
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="$day-$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$((day * 100 + n))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            ./gradlew assembleRelease \
              -PciVersionName="${{ steps.version.outputs.tag }}" \
              -PciVersionCode="${{ steps.version.outputs.code }}"
          else
            ./gradlew assembleRelease
          fi

      # Without the signing secrets the APK stays unsigned and cannot be installed.
      # Set KEY_BASE64, KEY_ALIAS and KEYSTORE_PASS to get a signed one.
      - uses: r0adkll/sign-android-release@v1
        name: Sign APK
        id: sign_app
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASS }}
          keyPassword: ${{ secrets.KEYSTORE_PASS }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload signed APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: droidify-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload unsigned APK
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: droidify-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING_KEY == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "droidify-$tag.apk"
          gh release create "$tag" "droidify-$tag.apk" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
